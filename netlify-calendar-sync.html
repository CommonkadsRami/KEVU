<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar Bridge (Netlify Ready)</title>
  <style>
    body{margin:0;background:#0b1020;color:#e8ecff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
    .card{width:min(860px,100%);background:#111831;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px}
    .row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}
    input,button{border-radius:10px;border:1px solid rgba(255,255,255,.2);padding:11px 12px;font-size:14px}
    input{background:#0c1329;color:#dbe5ff}.w100{width:100%}
    button{background:#6ea8ff;border:none;color:#03143a;font-weight:700;cursor:pointer}
    button.alt{background:transparent;border:1px solid rgba(255,255,255,.2);color:#e8ecff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
    .box{background:#161f3f;border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:12px}
    .log{margin-top:10px;background:#081031;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;min-height:130px;max-height:260px;overflow:auto;color:#aeb8e3}
    .muted{color:#9eb0dd;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Calendar Bridge — Netlify HTML</h1>
    <p class="muted">Upload this single HTML file to Netlify. Set your backend base URL below (where OAuth endpoints live), then connect and sync.</p>

    <label class="muted" for="apiBase">Backend base URL (required)</label>
    <div class="row">
      <input id="apiBase" class="grow" placeholder="https://your-backend.example.com" />
      <button id="saveBase">Save</button>
    </div>

    <section class="grid">
      <article class="box">
        <h3>Work (Microsoft 365)</h3>
        <p id="msStatus" class="muted">Not connected</p>
        <button id="msBtn">Connect Microsoft</button>
      </article>
      <article class="box">
        <h3>Personal (Google)</h3>
        <p id="googleStatus" class="muted">Not connected</p>
        <button id="googleBtn">Connect Google</button>
      </article>
    </section>

    <div class="row">
      <button id="syncBtn" disabled>Sync calendars</button>
      <button id="refreshBtn" class="alt">Refresh status</button>
      <button id="clearBtn" class="alt">Clear log</button>
    </div>

    <div id="log" class="log" aria-live="polite"></div>
  </main>

<script>
const els={
  apiBase:document.getElementById('apiBase'),saveBase:document.getElementById('saveBase'),
  msStatus:document.getElementById('msStatus'),googleStatus:document.getElementById('googleStatus'),
  msBtn:document.getElementById('msBtn'),googleBtn:document.getElementById('googleBtn'),
  syncBtn:document.getElementById('syncBtn'),refreshBtn:document.getElementById('refreshBtn'),
  clearBtn:document.getElementById('clearBtn'),log:document.getElementById('log')
};
const log=(m)=>{els.log.innerHTML+=`[${new Date().toLocaleTimeString()}] ${m}<br>`;els.log.scrollTop=els.log.scrollHeight};
const getBase=()=>localStorage.getItem('calendarBridgeApiBase')||'';
const setBase=(v)=>localStorage.setItem('calendarBridgeApiBase',v.replace(/\/$/,''));
const api=(p)=>`${getBase()}${p}`;

async function refresh(){
  if(!getBase()){log('Set backend base URL first.');return;}
  const res=await fetch(api('/auth/status'),{credentials:'include'});
  const d=await res.json();
  els.msStatus.textContent=d.microsoft.connected?`Connected as ${d.microsoft.email||'Microsoft account'}`:'Not connected';
  els.googleStatus.textContent=d.google.connected?`Connected as ${d.google.email||'Google account'}`:'Not connected';
  els.syncBtn.disabled=!(d.microsoft.connected&&d.google.connected);
}

els.saveBase.onclick=()=>{if(!els.apiBase.value.trim()) return log('Enter backend URL.'); setBase(els.apiBase.value.trim()); log(`Saved backend: ${getBase()}`); refresh().catch(e=>log(e.message));};
els.msBtn.onclick=()=>{if(!getBase()) return log('Set backend URL first.'); window.location.href=api('/auth/microsoft');};
els.googleBtn.onclick=()=>{if(!getBase()) return log('Set backend URL first.'); window.location.href=api('/auth/google');};
els.syncBtn.onclick=async()=>{const r=await fetch(api('/sync'),{method:'POST',credentials:'include'});const d=await r.json();if(!r.ok) return log(`Sync failed: ${d.error||'unknown'}`);log(`Synced ${d.imported} meeting(s).`)};
els.refreshBtn.onclick=()=>refresh().catch(e=>log(e.message));
els.clearBtn.onclick=()=>els.log.innerHTML='';

els.apiBase.value=getBase();
log('Ready. Save backend URL, connect Microsoft + Google, then sync.');
if(getBase()) refresh().catch(e=>log(`Status check failed: ${e.message}`));
</script>
</body>
</html>
